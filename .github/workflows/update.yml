name: 更新云量数据

on:
  schedule:
    # 每天北京时间 09:10 和 21:10 各抓一次（此处为 UTC 时间）
    - cron: "10 1,13 * * *"
  workflow_dispatch:   # 允许在 Actions 页面手动触发

permissions:
  contents: write      # 允许工作流把新数据提交回仓库

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 抓取最新天气数据
        run: node fetch_data.js

      - name: 提交更新（有变化时）
        run: |
          git config user.name "cloud-map-bot"
          git config user.email "cloud-map-bot@users.noreply.github.com"
          git add data.json spots.json
          git diff --cached --quiet && echo "数据无变化" || git commit -m "数据更新 $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
